name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  NODE_ENV: test
  DATABASE_URL: postgresql://test:test@127.0.0.1:5432/finance_manager_ci
  SESSION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
  ALLOWED_ORIGINS: http://127.0.0.1:5173
  WEB_APP_URL: http://127.0.0.1:5173
  EMAIL_VERIFICATION_SECRET: "2222222222222222222222222222222222222222222222222222222222222222"

jobs:
  quality:
    name: Build, unit tests and dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run unit tests
        run: npm run test:unit

      - name: Build API
        run: npm run build:api

      - name: Build web
        run: npm run build:web

      - name: Build Storybook
        run: npm run build:storybook:web

      - name: Audit dependencies
        run: npm run security:audit

  e2e:
    name: Browser flows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
