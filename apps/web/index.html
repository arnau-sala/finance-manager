    <script>
      (() => {
        const isStandalone =
          window.navigator.standalone === true ||
          window.matchMedia("(display-mode: standalone)").matches;

        if (!isStandalone) {
          return;
        }

        const viewportGap = Math.max(
          0,
          window.screen.height - window.innerHeight
        );

        document.documentElement.style.setProperty(
          "--app-splash-center-top",
          `${viewportGap / -2}px`
        );
        document.documentElement.style.setProperty(
          "--app-splash-center-bottom",
          `${viewportGap / 2}px`
        );
      })();
    </script>
    <style>
      /* Critical styles keep the first browser paint identical to React's splash. */
      :root {
        background: #ffffff;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: #ffffff;
      }

      .app-splash {
        position: fixed;
        z-index: 1000;
        inset: 0;
        display: grid;
        place-items: center;
        min-height: 100svh;
        overflow: hidden;
        padding:
          max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(28px, calc(env(safe-area-inset-bottom) + 20px))
          max(24px, env(safe-area-inset-left));
        box-sizing: border-box;
        color: #111827;
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .app-splash__center {
        position: absolute;
        top: var(--app-splash-center-top, 0);
        right: 0;
        bottom: var(--app-splash-center-bottom, 0);
        left: 0;
        display: grid;
        place-items: center;
        justify-items: center;
      }

      .app-splash__logo {
        display: block;
        width: min(152px, 40vw);
        height: auto;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

    </style>
