<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0F766E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Finance Manager" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest?v=20260711" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=20260711"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" href="/icons/app-icon.png" />
    <link
      rel="preload"
      href="/icons/app-icon-512.png"
      as="image"
      type="image/png"
    />
    <title>Finance Manager</title>
    <style>
      /* Critical styles keep the first browser paint identical to React's splash. */
      :root {
        background: #ffffff;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: #ffffff;
      }

      .app-splash {
        position: fixed;
        z-index: 1000;
        inset: 0;
        display: grid;
        place-items: center;
        min-height: 100svh;
        overflow: hidden;
        padding:
          max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(28px, calc(env(safe-area-inset-bottom) + 20px))
          max(24px, env(safe-area-inset-left));
        box-sizing: border-box;
        color: #111827;
        background: #ffffff;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .app-splash__center {
        display: grid;
        justify-items: center;
      }

      .app-splash__logo {
        display: block;
        width: min(152px, 40vw);
        height: auto;
      }

      .app-splash__brand {
        position: absolute;
        right: max(24px, env(safe-area-inset-right));
        bottom: max(28px, calc(env(safe-area-inset-bottom) + 20px));
        left: max(24px, env(safe-area-inset-left));
        margin: 0;
        color: #0f766e;
        font-size: 17px;
        line-height: 1.2;
        font-weight: 400;
        text-align: center;
        letter-spacing: 0;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

    </style>
  </head>
  <body>
    <div id="root">
      <main class="app-splash" role="status" aria-live="polite">
        <div class="app-splash__center" aria-hidden="true">
          <img
            class="app-splash__logo"
            src="/icons/app-icon-512.png"
            alt=""
            fetchpriority="high"
          />
        </div>

        <p class="app-splash__brand" aria-hidden="true">Finance Manager</p>
        <span class="sr-only">Loading Finance Manager</span>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
